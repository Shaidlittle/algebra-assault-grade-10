<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="384" height="384">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f0a1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Border glow -->
  <rect x="8" y="8" width="496" height="496" rx="88" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.6"/>
  <!-- Rocket/ship shape -->
  <path d="M256 100 L296 220 L340 280 L296 260 L296 380 L272 340 L256 360 L240 340 L216 380 L216 260 L172 280 L216 220 Z" fill="url(#accent)" opacity="0.9"/>
