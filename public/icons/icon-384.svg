  <text x="256" y="440" font-family="Arial, sans-serif" font-size="80" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle">x²</text>
  <!-- Stars -->
  <circle cx="80" cy="80" r="3" fill="white" opacity="0.8"/>
  <circle cx="420" cy="120" r="2.5" fill="white" opacity="0.7"/>
  <circle cx="100" cy="300" r="2" fill="white" opacity="0.6"/>
  <circle cx="430" cy="350" r="3" fill="white" opacity="0.8"/>
  <circle cx="380" cy="60" r="2" fill="white" opacity="0.5"/>
  <circle cx="130" cy="450" r="2.5" fill="white" opacity="0.7"/>
