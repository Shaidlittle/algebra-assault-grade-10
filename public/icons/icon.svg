<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f0a1e"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="60%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#eab308"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="window" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="70" cy="70" r="3" fill="white" opacity="0.9"/>
  <circle cx="440" cy="90" r="2.5" fill="white" opacity="0.7"/>
  <circle cx="90" cy="380" r="2" fill="white" opacity="0.6"/>
  <circle cx="420" cy="400" r="3" fill="white" opacity="0.8"/>
  <circle cx="380" cy="50" r="2" fill="white" opacity="0.5"/>
  <circle cx="50" cy="200" r="2.5" fill="white" opacity="0.7"/>
  <circle cx="460" cy="260" r="2" fill="white" opacity="0.6"/>
  <circle cx="130" cy="460" r="2" fill="white" opacity="0.5"/>
  <!-- Rocket body -->
  <path d="M256 80 C256 80 220 160 220 280 L220 340 L256 360 L292 340 L292 280 C292 160 256 80 256 80 Z" fill="url(#rocket)" stroke="white" stroke-width="3" stroke-opacity="0.3"/>
  <!-- Rocket nose cone highlight -->
  <path d="M256 80 C256 80 240 140 238 200 L256 190 L274 200 C272 140 256 80 256 80 Z" fill="white" fill-opacity="0.15"/>
  <!-- Window -->
  <circle cx="256" cy="220" r="24" fill="url(#window)" stroke="white" stroke-width="3" stroke-opacity="0.5"/>
  <circle cx="248" cy="212" r="8" fill="white" fill-opacity="0.4"/>
  <!-- Left fin -->
  <path d="M220 300 L180 360 L180 380 L220 340 Z" fill="#8b5cf6" stroke="white" stroke-width="2" stroke-opacity="0.3"/>
  <!-- Right fin -->
  <path d="M292 300 L332 360 L332 380 L292 340 Z" fill="#8b5cf6" stroke="white" stroke-width="2" stroke-opacity="0.3"/>
  <!-- Flame -->
  <path d="M236 360 L240 400 L248 420 L256 440 L264 420 L272 400 L276 360 Z" fill="url(#flame)" opacity="0.9"/>
  <path d="M244 360 L248 390 L256 410 L264 390 L268 360 Z" fill="#fde047" opacity="0.8"/>
  <!-- Small flame particles -->
  <circle cx="246" cy="430" r="4" fill="#f97316" opacity="0.6"/>
  <circle cx="266" cy="425" r="3" fill="#eab308" opacity="0.5"/>
  <circle cx="256" cy="445" r="3.5" fill="#ef4444" opacity="0.4"/>
</svg>
